name: "Android Release"

# Publishes a downloadable GitHub Release with the built APKs when an `android-v*`
# tag is pushed. Fork-only (lives on the `fork-release` branch, not in the upstream PR).
# Signing: uses the release keystore when the SAMEBOY_* secrets are set, otherwise the
# build falls back to the debug key (sideload-only, not for Play upload).
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Host-side C bridge unit tests — a release must not ship a broken bridge.
      - name: Host tests
        shell: bash
        run: ./Android/jni/test/run_host_tests.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.3.11579264"

      - name: Decode keystore
        if: ${{ secrets.SAMEBOY_KEYSTORE_BASE64 != '' }}
        env:
          SAMEBOY_KEYSTORE_BASE64: ${{ secrets.SAMEBOY_KEYSTORE_BASE64 }}
        run: echo "$SAMEBOY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sameboy.jks"

      - name: Build release APK (all 4 ABIs)
        working-directory: Android
        env:
          SAMEBOY_KEYSTORE: ${{ secrets.SAMEBOY_KEYSTORE_BASE64 != '' && format('{0}/sameboy.jks', runner.temp) || '' }}
          SAMEBOY_KEYSTORE_PASSWORD: ${{ secrets.SAMEBOY_KEYSTORE_PASSWORD }}
          SAMEBOY_KEY_ALIAS: ${{ secrets.SAMEBOY_KEY_ALIAS }}
          SAMEBOY_KEY_PASSWORD: ${{ secrets.SAMEBOY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      # Guard the 16 KB page-size fix (Android 15+/Play) and ABI coverage before publishing.
      - name: Verify ABIs + 16 KB alignment
        shell: bash
        working-directory: Android
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          count=$(unzip -l "$APK" | grep -c 'lib/.*/libsameboy_core.so')
          echo "libsameboy_core.so ABIs in APK: $count"
          test "$count" -eq 4
          READELF=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)
          fail=0
          for so in $(find app/build -path '*/lib/*/libsameboy_core.so'); do
            aligns=$("$READELF" -l "$so" | awk '/LOAD/{print $NF}' | sort -u)
            echo "$so LOAD aligns: $aligns"
            for a in $aligns; do
              if [ "$a" != "0x4000" ]; then echo "NOT 16 KB-aligned: $so ($a)"; fail=1; fi
            done
          done
          test "$fail" -eq 0

      - name: Stage APK with a versioned name
        id: stage
        shell: bash
        working-directory: Android
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          src=$(ls app/build/outputs/apk/release/*.apk | head -1)
          dst="$RUNNER_TEMP/release/sameboy-android-${GITHUB_REF_NAME#android-v}.apk"
          cp "$src" "$dst"
          echo "apk=$dst" >> "$GITHUB_OUTPUT"
          if [ -n "${SAMEBOY_KEYSTORE_BASE64:-}" ]; then
            echo "signed=release keystore" >> "$GITHUB_OUTPUT"
          else
            echo "signed=debug key (sideload-only, not for Play upload)" >> "$GITHUB_OUTPUT"
          fi
        env:
          SAMEBOY_KEYSTORE_BASE64: ${{ secrets.SAMEBOY_KEYSTORE_BASE64 }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.stage.outputs.apk }}
          SIGNED: ${{ steps.stage.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SameBoy Android ${GITHUB_REF_NAME#android-v}" \
            --notes "Automated Android release build (R8-minified, all 4 ABIs, 16 KB-aligned).

          Signing: $SIGNED

          Install: \`adb install -r sameboy-android-*.apk\`, or download and sideload."
