name: "Android"
on:
  push:
    paths:
      - 'Android/**'
      - 'Core/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Android/**'
      - 'Core/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Host-side C bridge unit tests (ring buffer, emulator, session, link) — no SDK needed.
      - name: Host tests
        shell: bash
        run: ./Android/jni/test/run_host_tests.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.3.11579264"

      # rgbds is required to build SameBoy's boot ROMs (make bootroms). Without it the
      # Gradle generateBootRoms task skips and the APK ships boot-ROM-less, which hangs
      # some CGB titles (e.g. Pokémon Crystal) on a white screen. Ubuntu 24.04 ships 0.7.0.
      - name: Install rgbds (boot ROMs)
        run: sudo apt-get update && sudo apt-get install -y rgbds

      - name: Build debug APK (all 4 ABIs)
        working-directory: Android
        run: ./gradlew --no-daemon :app:assembleDebug

      # Boot ROMs MUST be bundled — an empty assets/bootroms/ boots blank on real ROMs.
      - name: Verify boot ROMs bundled
        shell: bash
        working-directory: Android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          n=$(unzip -l "$APK" | grep -c 'assets/bootroms/.*\.bin')
          echo "boot ROM .bin assets in APK: $n"
          test "$n" -ge 5

      # Guard the 16 KB page-size fix (Android 15+/Play requirement) and ABI coverage.
      - name: Verify ABIs + 16 KB alignment
        shell: bash
        working-directory: Android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          count=$(unzip -l "$APK" | grep -c 'lib/.*/libsameboy_core.so')
          echo "libsameboy_core.so ABIs in APK: $count"
          test "$count" -eq 4
          READELF=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)
          fail=0
          for so in $(find app/build -path '*/lib/*/libsameboy_core.so'); do
            aligns=$("$READELF" -l "$so" | awk '/LOAD/{print $NF}' | sort -u)
            echo "$so LOAD aligns: $aligns"
            for a in $aligns; do
              if [ "$a" != "0x4000" ]; then echo "NOT 16 KB-aligned: $so ($a)"; fail=1; fi
            done
          done
          test "$fail" -eq 0

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sameboy-android-debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk

  # Signed release build — only when signing secrets are configured (e.g. on tags). Guarded
  # so forks/PRs without secrets still pass via the debug job above.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;26.3.11579264"
      # secrets are NOT available in step `if:` — map to env and gate in shell. Sets
      # SAMEBOY_KEYSTORE for the build only when the keystore secret is present; otherwise
      # the build falls back to the debug key (see app/build.gradle).
      - name: Decode keystore (optional)
        env:
          SAMEBOY_KEYSTORE_BASE64: ${{ secrets.SAMEBOY_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$SAMEBOY_KEYSTORE_BASE64" ]; then
            echo "$SAMEBOY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sameboy.jks"
            echo "SAMEBOY_KEYSTORE=$RUNNER_TEMP/sameboy.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        working-directory: Android
        env:
          SAMEBOY_KEYSTORE_PASSWORD: ${{ secrets.SAMEBOY_KEYSTORE_PASSWORD }}
          SAMEBOY_KEY_ALIAS: ${{ secrets.SAMEBOY_KEY_ALIAS }}
          SAMEBOY_KEY_PASSWORD: ${{ secrets.SAMEBOY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sameboy-android-release
          path: Android/app/build/outputs/apk/release/*.apk
